[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nygen-router"
version = "0.1.0"
description = "Lightweight provider router foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
openai = [
    "openai>=1,<2",
]
duckdb = [
    "duckdb>=0.10,<2",
]
dev = [
    "coverage>=7,<8",
    "duckdb>=0.10,<2",
    "httpx>=0.24,<1",
    "mypy>=1,<2",
    "openai>=1,<2",
    "pytest>=7,<9",
    "python-dotenv>=1,<2",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nygen_router = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
